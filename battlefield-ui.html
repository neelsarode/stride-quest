<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Stride Quest — UI (stone + gold)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
  img.sprite { image-rendering: pixelated; image-rendering: crisp-edges; }
  .px { image-rendering: pixelated; }

  #stage { position: fixed; inset: 0; overflow: hidden; }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; }

  .hero { position: absolute; transform-origin: bottom center; }
  .hero img { display: block; height: 100%; }
  .hero .shadow { position: absolute; left: 50%; bottom: 4px; width: 66%; height: 15px;
    transform: translateX(-50%); border-radius: 50%; background: #000; opacity: .65; filter: blur(5px); }
  #boss { position: absolute; right: 0; bottom: 22%; transform: translateX(30%); transform-origin: right bottom; }
  #boss img { display: block; height: 100%; filter: drop-shadow(0 14px 10px rgba(0,0,0,.5)); }

  #topbar, #bossbar, #rightnav, #jobxpframe, #jobbadge,
  #collect, #collectlabel, #attackwrap, #stepswrap, #mocklabel { z-index: 100; }

  /* ALL HUD chrome below is PROCEDURAL — canvases drawn by assets/ui-kit.js.
     Divs only position; zero image files, zero CSS gradients in the chrome. */
  canvas.px { display: block; }

  /* ---- top status ---- */
  #topbar { position: absolute; top: 0; left: 0; right: 0; padding: 46px 14px 8px;
    display: flex; justify-content: space-between; align-items: flex-start;
    background: linear-gradient(180deg, rgba(8,6,10,.9), rgba(8,6,10,0)); }
  #player { display: flex; gap: 9px; align-items: center; }
  .avatar { width: 60px; height: 60px; }
  #pname, #pmeta, #streakchip { margin-bottom: 4px; }
  #day canvas { margin-left: auto; }

  /* ---- boss banner: GOLD hp bar (highest hierarchy) ---- */
  #bossbar { position: absolute; top: 104px; left: 0; right: 0; }
  #bossbar canvas { margin: 0 auto 3px; }

  /* ---- right nav: STONE buttons (emblems baked in) ---- */
  #rightnav { position: absolute; right: 9px; top: 204px; display: flex; flex-direction: column; gap: 9px; }

  /* ---- party rail: horizontal row centered under the boss HP bar
     (a vertical column covered the party sprites) ---- */
  #partyrail { position: absolute; left: 0; right: 0; top: 196px; display: flex;
    flex-direction: row; align-items: center; justify-content: center; gap: 6px;
    z-index: 100; pointer-events: none; }
  #partyrail canvas { pointer-events: auto; }
  #popwrap { position: absolute; z-index: 140; }
  #toastwrap { position: absolute; left: 0; right: 0; top: 250px; display: flex;
    justify-content: center; z-index: 150; pointer-events: none; }
  #scrim { position: fixed; inset: 0; background: rgba(6,8,12,.6); z-index: 300;
    display: none; align-items: center; justify-content: center; }

  /* ---- bottom: buttons band over a full-width XP bar (mirrors the boss bar) ---- */
  #jobxpframe { position: absolute; left: 9px; right: 9px; bottom: 18px; height: 42px; }
  #jobbadge { position: absolute; left: 4px; bottom: 11px; }

  /* ---- Collect (silver burst button) bottom-left ---- */
  #collect { position: absolute; left: 16px; bottom: 84px; }
  #collectlabel { position: absolute; left: 16px; bottom: 70px; width: 72px; }
  #collectlabel canvas { margin: 0 auto; }

  /* ---- ATTACK (GOLD hi-fi button, highest hierarchy) bottom-center;
     cost lives INSIDE the button ---- */
  #attackwrap { position: absolute; left: 50%; bottom: 78px; transform: translateX(-50%); width: 168px; height: 116px; }
  #attackbtn { position: absolute; top: 0; left: 0; }
  #streakbadge { position: absolute; top: -6px; right: -8px; }

  /* ---- Steps ring bottom-right ---- */
  #stepswrap { position: absolute; right: 16px; bottom: 84px; }

  #mocklabel { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,.32); font-size: 9px; letter-spacing: 1px; }

  /* ---- phone fit (iPhone-class widths): tighter tops via real safe-area
     insets, secondary chrome drops 3x → 2x (JS PHONE flag), lower bottom band.
     Desktop layout above is untouched. ---- */
  @media (max-width: 430px) {
    #topbar { padding: max(14px, env(safe-area-inset-top)) 14px 8px; }
    #bossbar   { top: calc(max(14px, env(safe-area-inset-top)) + 56px); }
    #partyrail { top: calc(max(14px, env(safe-area-inset-top)) + 146px); }
    #rightnav  { top: calc(max(14px, env(safe-area-inset-top)) + 146px); }
    #toastwrap { top: calc(max(14px, env(safe-area-inset-top)) + 200px); }
    #attackwrap { bottom: 46px; }
    #collect { bottom: 62px; }
    #collectlabel { bottom: 48px; width: 64px; }
    #stepswrap { bottom: 62px; }
    #jobxpframe { bottom: max(12px, env(safe-area-inset-bottom)); }
    #jobbadge { bottom: calc(max(12px, env(safe-area-inset-bottom)) - 7px); }
    #mocklabel { display: none; }   /* dev watermark collides with the XP bar at 390px */
    .avatar { width: 40px; height: 40px; }          /* 20 art px @ 2x */
    #attackwrap { width: 112px; height: 78px; }     /* 56x37 art px @ 2x */
  }
</style>
</head>
<body>
  <div id="stage">
    <img id="bg" src="assets/backgrounds/battlefield_beach.png" alt="" />

    <div id="topbar">
      <div id="player">
        <div class="avatar"></div>
        <div>
          <div id="pname"></div>
          <div id="pmeta"></div>
          <div id="streakchip"></div>
        </div>
      </div>
      <div id="day"></div>
    </div>

    <div id="bossbar">
      <div id="bossname"></div>
      <div id="bosshpwrap"></div>
    </div>

    <div id="rightnav"></div>
    <div id="partyrail"></div>
    <div id="popwrap"></div>
    <div id="toastwrap"></div>

    <div id="jobxpframe"></div>
    <div id="jobbadge"></div>

    <div id="collect"></div>
    <div id="collectlabel"></div>

    <div id="attackwrap">
      <div id="attackbtn"></div>
      <div id="streakbadge"></div>
    </div>

    <div id="stepswrap"></div>

    <div id="mocklabel">S8 CELESTIAL SILVER — hi-fi procedural UI, zero image chrome (assets/ui-kit.js)</div>
  </div>
  <!-- body-level so it stacks above the FX layer (projectiles are z61 on body) -->
  <div id="scrim"></div>

<script src="assets/ui-kit.js"></script>
<script src="assets/fx-anchors.js"></script>
<script src="assets/fx-special-anchors.js"></script>
<script src="assets/fx-engine.js"></script>
<script>
  const stage = document.getElementById('stage');
  // Phone fit: smaller heroes + a tighter stack so the boss autoscale stays sane
  // on 390px screens. Desktop keeps the original scale.
  const PHONE = matchMedia('(max-width: 430px)').matches;
  const PX_PER_SRC = PHONE ? 1.4 : 1.7;
  const SRC_HERO = 128, SRC_BOSS = 256;
  const HERO_PX = SRC_HERO * PX_PER_SRC;
  const BOSS_PX = SRC_BOSS * PX_PER_SRC;
  const COL_L = -8, COL_R = 4;
  const PARTY_DX = -18, PARTY_DY = 50;   // px nudge: negative DX = left, positive DY = down
  const JOBS = {
    mage:['1_apprentice','2_adept','3_conjurer','4_sorcerer','5_archmage'],
    assassin:['1_footpad','2_prowler','3_nightblade','4_assassin','5_shadowlord'],
    warrior:['1_rookie','2_strider','3_vanguard','4_champion','5_warlord'],
    archer:['1_greenhorn','2_scout','3_hunter','4_ranger','5_sentinel'],
    paladin:['1_squire','2_knight','3_crusader','4_paladin','5_lightbringer'],
    bard:['1_busker','2_minstrel','3_troubadour','4_bard','5_maestro'],
    medic:['1_acolyte','2_healer','3_cleric','4_priest','5_hierophant'],
    warlock:['1_initiate','2_cultist','3_hexer','4_warlock','5_dreadlord'],
  };
  // Front hero sits at PARTY_BASE so his feet line up with the boss's feet
  // (boss box bottom is 22%); each row behind steps up PARTY_STEP.
  const PARTY_BASE = 22, PARTY_STEP = PHONE ? 4.2 : 5;
  const HEROES = [
    { cls:'mage',     left:COL_R, z:9 },
    { cls:'assassin', left:COL_L, z:8 },
    { cls:'warrior',  left:COL_R, z:7 },
    { cls:'archer',   left:COL_L, z:6 },
    { cls:'paladin',  left:COL_R, z:5 },
    { cls:'bard',     left:COL_L, z:4 },
    { cls:'medic',    left:COL_R, z:3 },
    { cls:'warlock',  left:COL_L, z:2 },
  ].map((h,i)=>({ ...h, bottom: PARTY_BASE + i*PARTY_STEP }));
  const BOSS = { dir:'characters/bosses/horse_256/idle', frames:9, fps:9 };
  const CYCLE_MS = 3600, STAGGER_MS = 420, SPECIAL_EVERY = 4;  // basics every cycle; each hero's 4th attack = special

  const bossEl=document.createElement('div'); bossEl.id='boss'; bossEl.style.height=BOSS_PX+'px';
  bossEl.style.transform='translateX(30%)';
  const bossImg=document.createElement('img'); bossImg.className='sprite';
  const bf=FXEngine.framesOf(BOSS.dir,BOSS.frames); bossImg.src=bf[0]; FXEngine.preload(bf);
  bossEl.appendChild(bossImg); stage.appendChild(bossEl);
  let bi=0; setInterval(()=>{bi=(bi+1)%bf.length;bossImg.src=bf[bi];},1000/BOSS.fps);
  FXEngine.setBoss(bossImg,bossEl);
  FXEngine.layer = stage;   // effects (z 60-62) render below HUD chrome (z 100+), above heroes

  let jobTier=5;
  const fighters=HEROES.map(hd=>{
    const el=document.createElement('div'); el.className='hero';
    el.style.left=`calc(${hd.left}% + ${PARTY_DX}px)`; el.style.bottom=`calc(${hd.bottom}% - ${PARTY_DY}px)`;
    el.style.height=HERO_PX+'px'; el.style.zIndex=hd.z; el.style.cursor='pointer';
    const img=document.createElement('img'); img.className='sprite';
    const shadow=document.createElement('div'); shadow.className='shadow';
    el.appendChild(shadow); el.appendChild(img); stage.appendChild(el);
    const fighter=FXEngine.makeFighter(img,hd.cls,JOBS[hd.cls][jobTier-1]);
    el.onclick=()=>fighter.special();   // tap a hero → fire their ultimate now
    return fighter;
  });

  // Boss auto-scale: never shorter than the party stack — his visible top must
  // reach the top party member's head. (Fractions: horse art starts 6px into
  // its 256px canvas; hero heads sit ~20% into their canvas.)
  const BOSS_TOP_PAD=6/256, HERO_TOP_PAD=0.20, BOSS_BOTTOM_PCT=0.22;
  const heroEls=[...document.querySelectorAll('.hero')];
  function sizeBoss(){
    const hr=heroEls[heroEls.length-1].getBoundingClientRect();
    const partyTopY=hr.top+hr.height*HERO_TOP_PAD;
    const bossBottomY=innerHeight*(1-BOSS_BOTTOM_PCT);
    const needed=(bossBottomY-partyTopY)/(1-BOSS_TOP_PAD);
    bossEl.style.height=Math.max(BOSS_PX,needed)+'px';
  }
  sizeBoss(); addEventListener('resize',sizeBoss);

  let cycle=0;
  setInterval(()=>{
    if (window.__restingAll) return;   // party is kneeling — no attack orders
    cycle++;
    fighters.forEach((f,i)=>setTimeout(()=>{
      ((cycle+i)%SPECIAL_EVERY===0) ? f.special() : f.basic();
    }, i*STAGGER_MS));
  },CYCLE_MS);

  // job-tier switcher (dev): swaps every hero to that tier's sprites + anchors
  const sel=document.createElement('select');
  sel.id='jobswitch';
  sel.style.cssText='position:absolute;left:12px;z-index:120;background:#1c1723;color:#d8c9a0;border:1px solid #6b5a3e;border-radius:6px;font-size:11px;font-weight:700;padding:3px 6px;'
    + (PHONE ? 'top:calc(max(14px, env(safe-area-inset-top)) + 146px);' : 'top:204px;');
  for(let t=1;t<=5;t++){const o=document.createElement('option');o.value=t;o.textContent='JOB '+t;if(t===jobTier)o.selected=true;sel.appendChild(o);}
  sel.onchange=()=>{jobTier=+sel.value;fighters.forEach((f,i)=>f.setJob(JOBS[HEROES[i].cls][jobTier-1]));};
  stage.appendChild(sel);

  // REST toggle (dev): the whole party kneels — previews the out-of-fuel
  // Resting state with the per-job rest animations (STR-38). Attack cycle and
  // tap-to-ult are blocked while resting (rest mode ignores attack orders).
  window.__restingAll = false;
  const restBtn = document.createElement('button');
  restBtn.id = 'resttoggle';
  restBtn.textContent = 'REST: OFF';
  restBtn.style.cssText = 'position:absolute;left:12px;z-index:120;background:#1c1723;color:#d8c9a0;border:1px solid #6b5a3e;border-radius:6px;font-size:11px;font-weight:700;padding:3px 6px;cursor:pointer;'
    + (PHONE ? 'top:calc(max(14px, env(safe-area-inset-top)) + 182px);' : 'top:240px;');
  restBtn.onclick = () => {
    window.__restingAll = !window.__restingAll;
    restBtn.textContent = window.__restingAll ? 'REST: ON' : 'REST: OFF';
    restBtn.style.color = window.__restingAll ? '#9fe8c8' : '#d8c9a0';
    fighters.forEach(f => f.setResting(window.__restingAll));
  };
  stage.appendChild(restBtn);
</script>
<script>
// ============ PROCEDURAL HUD v2 — S8 "CELESTIAL SILVER" (hi-fi kit) ============
// Silver hi-fi frames, midnight wells, radiant gold vitals. Everything drawn by
// the ui-kit hi-fi layer at 1 art-px = 3 css-px; zero image chrome, no CSS text.
'use strict';
{
  // css px per art px: 3x desktop, 2x on iPhone-class widths — ALL chrome.
  // Hierarchy comes from ART size (ATTACK is 56 art px wide vs 18 for nav),
  // not from mixed pixel scales.
  const UI_S = matchMedia('(max-width: 430px)').matches ? 2 : 3;
  const S2 = UI_S;
  const AG = M('silver'), AU = M('gold');
  const GOLD_FAM = { light:'gold1', mid:'gold2', dark:'gold4' };
  const SKY_FAM  = { light:'sky_light', mid:'sky_mid', dark:'sky_dark' };
  const T_S8 = { mat: AG, well:'night_w', wellD:'night_wd', hp: GOLD_FAM };
  const RAMP_GREEN = makeRamp('acc_green', [PALETTE.green_light, PALETTE.green_mid, PALETTE.green_dark], 6, false);
  const RAMP_RED   = makeRamp('acc_red',   [PALETTE.red_light, PALETTE.red_mid, PALETTE.red_dark], 6, false);

  function uiCanvas(w, h, cssScale = UI_S){
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.style.width = w * cssScale + 'px';
    c.style.height = h * cssScale + 'px';
    c.className = 'px';
    c.getContext('2d').imageSmoothingEnabled = false;
    return c;
  }
  // Static pixel-text canvas. lines = string | [strings]. cssScale 2 = small caption.
  function textEl(id, lines, key, cssScale, align = 'left'){
    lines = Array.isArray(lines) ? lines : [lines];
    const w = Math.max(...lines.map(l => textWidth(l))) + 2;
    const h = lines.length * 7;
    const c = uiCanvas(w, h, cssScale);
    const ctx = c.getContext('2d');
    lines.forEach((l, i) => {
      const lx = align === 'right' ? w - 1 - textWidth(l)
        : align === 'center' ? Math.round((w - textWidth(l)) / 2) : 1;
      drawText(ctx, l, lx, 1 + i * 7, key);
    });
    document.getElementById(id).appendChild(c);
    return c;
  }
  // Interactive hi-fi button (pressed = contents shift down 1px).
  function hifiButtonCanvas(w, h, m, content, onClick, cssScale = UI_S){
    const c = uiCanvas(w, h + 1, cssScale);      // +1 for the drop-shadow row
    const ctx = c.getContext('2d');
    const redraw = pressed => { ctx.clearRect(0, 0, c.width, c.height); hifiButton(ctx, 0, 0, w, h, m, content, pressed); };
    c.style.cursor = 'pointer';
    c.addEventListener('mousedown',  () => redraw(true));
    c.addEventListener('mouseup',    () => { redraw(false); if (onClick) onClick(); });
    c.addEventListener('mouseleave', () => redraw(false));
    redraw(false);
    return c;
  }

  /* ---- top status ---- */
  textEl('pname', 'HERO-EHB8', 'white', UI_S);
  textEl('pmeta', 'WARRIOR - JOB 2 STRIDER', 'sky_mid', 2);
  textEl('streakchip', '3-DAY STREAK', 'red_light', 2);
  textEl('day', ['WEEK 1', 'MON'], 'sky_mid', 2, 'right');
  {
    // Profile pic = the player's ACTUAL class/job head (Warrior Job 2 Strider)
    // cropped from the game sprite into a silver portrait frame.
    const c = uiCanvas(20, 20, S2), ctx = c.getContext('2d');
    hifiPortrait(ctx, 0, 0, 20, AG, 'night_wd', null);
    const img = new Image();
    img.onload = () => { ctx.clearRect(0, 0, 20, 20); hifiPortrait(ctx, 0, 0, 20, AG, 'night_wd', img, PORTRAIT_CROPS.warrior_j2); };
    img.src = 'characters/warrior/2_strider/south.png';
    document.querySelector('.avatar').appendChild(c);
  }

  /* ---- boss banner: LIVE silver-framed bar, radiant gold fill ---- */
  textEl('bossname', 'THE NIGHTMARE', 'gold1', UI_S, 'center');
  const boss = { max: 100000, hp: 100000, disp: 100000, ghost: 100000, ghostDelay: 0, flash: 0, downTimer: 0 };
  const BOSS_BAR_W = Math.floor((innerWidth - 18) / UI_S);   // full width inside the 9px outer padding
  const bossBarC = uiCanvas(BOSS_BAR_W, 20);
  document.getElementById('bosshpwrap').appendChild(bossBarC);
  const bossBarCtx = bossBarC.getContext('2d');
  FXEngine.onDamage = (amount) => {
    if (boss.hp <= 0) return;
    boss.hp = Math.max(0, boss.hp - amount);
    boss.flash = 10;
    boss.ghostDelay = 16;
    if (boss.hp === 0) boss.downTimer = 160;   // ~2.7s of DEFEATED!, then respawn
  };
  const fmt = n => Math.round(n).toLocaleString('en-US');
  (function bossLoop(){
    const b = boss, d = b.hp - b.disp;
    b.disp = Math.abs(d) < b.max * .002 ? b.hp : b.disp + d * .12;
    if (b.ghost < b.disp) b.ghost = b.disp;
    if (b.ghost > b.disp){
      if (b.ghostDelay > 0) b.ghostDelay--;
      else b.ghost = Math.max(b.disp, b.ghost - Math.max(b.max * .004, (b.ghost - b.disp) * .08));
    }
    if (b.flash > 0) b.flash--;
    if (b.downTimer > 0 && --b.downTimer === 0){ b.hp = b.max; b.disp = b.max; b.ghost = b.max; }
    const dead = b.hp <= 0;
    let label = dead ? 'DEFEATED!' : fmt(b.disp) + ' / ' + fmt(b.max);
    if (dead && (b.downTimer % 24) >= 16) label = null;   // frame-count blink while down
    bossBarCtx.clearRect(0, 0, BOSS_BAR_W, 20);
    hifiBar(bossBarCtx, 0, 0, BOSS_BAR_W, 20, T_S8,
      { value: b.disp / b.max, ghost: b.ghost / b.max, flash: b.flash, label, labelKey: dead ? 'gold1' : 'white' });
    requestAnimationFrame(bossLoop);
  })();

  /* ---- right nav: silver hi-fi buttons, emblems baked in ---- */
  const chartDraw = (ctx, x, y, w, h) => {           // stats = bar chart
    const bx = x + Math.round((w - 12) / 2), by = y + Math.round((h - 10) / 2);
    const bar = (ox, bh, key) => {
      outlineRect(ctx, bx + ox, by + 10 - bh, 4, bh);
      px(ctx, bx + ox + 1, by + 11 - bh, 2, bh - 2, key);
    };
    bar(0, 5, 'silver1'); bar(4, 10, 'gold2'); bar(8, 7, 'silver1');
  };
  const nav = document.getElementById('rightnav');
  nav.appendChild(hifiButtonCanvas(18, 18, AG, { sprite: scaleSprite(BANNER, 2) }, null, S2));
  nav.appendChild(hifiButtonCanvas(18, 18, AG, { draw: chartDraw }, null, S2));
  nav.appendChild(hifiButtonCanvas(18, 18, AG, { text: '?', scale: 2 }, () => openHelp(), S2));

  /* ---- job XP: slim silver bar, sky fill + silver badge roundel ---- */
  const xpWrap = document.getElementById('jobxpframe');
  const xpC = document.createElement('canvas');
  xpC.className = 'px';
  xpWrap.appendChild(xpC);
  function drawXP(){
    const w = Math.max(40, Math.floor(xpWrap.clientWidth / S2));
    xpC.width = w; xpC.height = 14;
    xpC.style.width = w * S2 + 'px'; xpC.style.height = 14 * S2 + 'px';
    const ctx = xpC.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    hifiBar(ctx, 0, 0, w, 14, T_S8,
      { value: 12000 / 25000, fam: SKY_FAM, slim: true, label: '12,000 / 25,000 XP' });
  }
  drawXP(); addEventListener('resize', drawXP);
  {
    const c = uiCanvas(18, 19, S2), ctx = c.getContext('2d');
    hifiBadge(ctx, 0, 0, '2', AG);
    document.getElementById('jobbadge').appendChild(c);
  }

  /* ---- collect: silver hi-fi button + banked-idle chip ---- */
  {
    const c = uiCanvas(32, 30, S2), ctx = c.getContext('2d');
    const redraw = pressed => {
      ctx.clearRect(0, 0, 32, 30);
      hifiButton(ctx, 0, 5, 24, 24, AG, { sprite: STAR }, pressed);
      hifiChip(ctx, 7, 0, '+320', AG, RAMP_GREEN);
    };
    c.style.cursor = 'pointer';
    c.addEventListener('mousedown',  () => redraw(true));
    c.addEventListener('mouseup',    () => redraw(false));
    c.addEventListener('mouseleave', () => redraw(false));
    redraw(false);
    document.getElementById('collect').appendChild(c);
  }
  textEl('collectlabel', 'COLLECT', 'sky_mid', 2, 'center');

  /* ---- ATTACK: GOLD hi-fi button (high hierarchy) → real party volley.
     Face = small crossed swords over the energy cost, all inside the button ---- */
  const attackFace = (ctx, x, y, w, h) => {
    const label = '4,200';
    const stackH = 11 + 2 + 7;                       // swords + gap + cost row
    const top = y + Math.round((h - stackH) / 2);
    drawSprite(ctx, CROSSED_SWORDS, x + Math.round((w - 11) / 2), top);
    const lw = 8 + 2 + textWidth(label);             // gem + gap + text
    const lx = x + Math.round((w - lw) / 2);
    drawSprite(ctx, GEM, lx, top + 13);
    drawText(ctx, label, lx + 10, top + 14, 'white');
  };
  document.getElementById('attackbtn').appendChild(
    hifiButtonCanvas(56, 36, AU, { draw: attackFace },
      () => fighters.forEach((f, i) => setTimeout(() => f.basic(), i * 120))));
  {
    const c = uiCanvas(textWidth('X1.2') + 10, 11), ctx = c.getContext('2d');
    hifiChip(ctx, 0, 0, 'X1.2', AG, RAMP_RED);
    document.getElementById('streakbadge').appendChild(c);
  }

  /* ---- steps ring: pixel donut, radiant gold progress ---- */
  {
    const c = uiCanvas(30, 30, S2), ctx = c.getContext('2d');
    drawPixelRing(ctx, 15, 15, 14, 11, 6200 / 8000, 'gold2', 'night_w');
    drawText(ctx, '6,200', Math.round((30 - textWidth('6,200')) / 2), 9, 'white');
    drawText(ctx, '8,000', Math.round((30 - textWidth('8,000')) / 2), 16, 'sky_mid');
    document.getElementById('stepswrap').appendChild(c);
  }

  /* ---- party rail: full-body portraits + fuel-state dots → tap for stats ---- */
  const T8 = { mat: AG, sec: AU, well:'night_w', wellD:'night_wd', text:'silver1', textDim:'sky_mid' };
  const MATES = [
    { name:'MAYA', cls:'mage',   job:'5_archmage',   state:'battling', steps:'9,842', dmg:'38,210', streak:'6 DAYS', fuel:.78, fuelLabel:'FIGHTS 16H' },
    { name:'JAKE', cls:'archer', job:'5_sentinel',   state:'winded',   steps:'4,120', dmg:'22,405', streak:'2 DAYS', fuel:.28, fuelLabel:'WINDED 4H' },
    { name:'SAM',  cls:'medic',  job:'5_hierophant', state:'resting',  steps:'1,050', dmg:'8,750',  streak:'0 DAYS', fuel:0,   fuelLabel:'EMPTY' },
  ];
  const rail = document.getElementById('partyrail');
  const popwrap = document.getElementById('popwrap');
  const toastwrap = document.getElementById('toastwrap');
  function showToast(msg){
    const c = uiCanvas(textWidth(msg) + 12, 14, S2);
    hifiToast(c.getContext('2d'), 0, 0, msg, AG, 'night_wd');
    toastwrap.textContent = '';
    toastwrap.appendChild(c);
    setTimeout(() => { if (c.parentNode) c.remove(); }, 1800);
  }
  function closePopover(){ popwrap.textContent = ''; popwrap.dataset.open = ''; }
  function openPopover(mate, anchorEl){
    closePopover();
    popwrap.dataset.open = mate.name;
    const hasRally = mate.state === 'resting';
    const H = hasRally ? 73 : 53;
    const c = uiCanvas(135, H + 4, S2);
    const ctx = c.getContext('2d');
    // row layout: popover hangs BELOW the tapped portrait; arrow x is set after placement
    const anchorMidX = anchorEl.getBoundingClientRect().left + anchorEl.getBoundingClientRect().width / 2;
    const popW = 135 * S2;
    const popLeft = Math.max(8, Math.min(Math.round(anchorMidX - 30), innerWidth - popW - 8));
    const arrowAt = Math.max(8, Math.min(Math.round((anchorMidX - popLeft) / S2), 124));
    const pw = hifiPopover(ctx, 0, 3, 132, H, T8, 'top', arrowAt);
    drawText(ctx, mate.name + ' - ' + mate.cls.toUpperCase(), pw.wx + 4, pw.wy + 3, 'silver1');
    drawText(ctx, mate.state.toUpperCase(),
      pw.wx + pw.ww - 4 - textWidth(mate.state.toUpperCase()), pw.wy + 3, STATE_COLORS[mate.state]);
    const line = (lab, val, y) => {
      drawText(ctx, lab, pw.wx + 4, y, 'sky_mid');
      drawText(ctx, val, pw.wx + pw.ww - 4 - textWidth(val), y, 'silver1');
    };
    line('STEPS TODAY', mate.steps, pw.wy + 13);
    line('DMG WEEK', mate.dmg, pw.wy + 22);
    line('STREAK', mate.streak, pw.wy + 31);
    line('FUEL', mate.fuelLabel, pw.wy + 40);
    let rallyRect = null;
    if (hasRally){
      hifiButton(ctx, pw.wx + 3, pw.wy + 51, pw.ww - 6, 15, AU, { text: 'SEND RALLY 500' });
      rallyRect = { x: pw.wx + 3, y: pw.wy + 51, w: pw.ww - 6, h: 16 };
    }
    c.addEventListener('click', e => {
      e.stopPropagation();
      if (!rallyRect) return;
      const r = c.getBoundingClientRect();
      const mx = Math.floor((e.clientX - r.left) / (r.width / c.width));
      const my = Math.floor((e.clientY - r.top) / (r.height / c.height));
      if (mx >= rallyRect.x && mx < rallyRect.x + rallyRect.w &&
          my >= rallyRect.y && my < rallyRect.y + rallyRect.h){
        showToast('RALLY SENT TO ' + mate.name + '!');
        closePopover();
      }
    });
    popwrap.appendChild(c);
    const railRect = rail.getBoundingClientRect();
    popwrap.style.left = popLeft + 'px';
    popwrap.style.top = Math.round(railRect.bottom + 4) + 'px';
  }
  // Rally beacon: a resting (out-of-fuel) teammate breathes a soft gold ring —
  // gold = "action available" (same key as SEND RALLY) — swell, hold, fade, pause.
  const BEACON_SEQ = [0,0,0,0,0,0,1,2,3,3,3,3,3,2,1,0];   // 10fps → swell, 500ms hold, fade, rest
  const BEACON_KEYS = [null, 'gold4', 'gold2', 'gold1'];
  MATES.forEach(mate => {
    const needsRally = mate.state === 'resting';
    // 18 art-px @ 3x — same recipe as the right-nav buttons; +1px margin for the
    // beacon ring, drawn flush against the portrait frame (a touching gold border)
    const PAD = needsRally ? 1 : 0, S = 18 + PAD * 2;
    const c = uiCanvas(S, S + 6, S2), ctx = c.getContext('2d');   // +6: fuel sliver row
    let spriteImg = null, beat = 0;
    const draw = () => {
      ctx.clearRect(0, 0, S, S + 6);
      const key = needsRally ? BEACON_KEYS[BEACON_SEQ[beat]] : null;
      if (key){                                            // rounded 1px ring, notched corners
        px(ctx, 2, 0, S-4, 1, key); px(ctx, 2, S-1, S-4, 1, key);
        px(ctx, 0, 2, 1, S-4, key); px(ctx, S-1, 2, 1, S-4, key);
        px(ctx, 1, 1, 1, 1, key); px(ctx, S-2, 1, 1, 1, key);
        px(ctx, 1, S-2, 1, 1, key); px(ctx, S-2, S-2, 1, 1, key);
      }
      hifiPortrait(ctx, PAD, PAD, 18, AG, 'night_wd', spriteImg, PORTRAIT_CROPS[mate.cls]);
      // out-of-fuel reads RED on the roster (teammate call-to-action, not self-shame)
      hifiStatusDot(ctx, PAD + 12, PAD + 12, needsRally ? 'red_mid' : mate.state);
      // fuel sliver under the portrait (lab convention: sliver = FUEL, empty = rally me)
      fillRounded(ctx, PAD, S + 1, 18, 5, 2, AG.out);
      const fam = hpFamily(mate.fuel);
      px(ctx, PAD + 1, S + 2, Math.max(1, Math.round(16 * mate.fuel)), 1, fam.light);
      px(ctx, PAD + 1, S + 3, Math.max(1, Math.round(16 * mate.fuel)), 2, fam.mid);
    };
    draw();
    const img = new Image();
    img.onload = () => { spriteImg = img; draw(); };
    img.src = `characters/${mate.cls}/${mate.job}/south.png`;
    if (needsRally) setInterval(() => { beat = (beat + 1) % BEACON_SEQ.length; draw(); }, 100);
    c.style.cursor = 'pointer';
    c.addEventListener('click', e => {
      e.stopPropagation();
      if (popwrap.dataset.open === mate.name) closePopover();
      else openPopover(mate, c);
    });
    rail.appendChild(c);
  });

  /* ---- invite slot: empty well + chunky plus → guild-code popover ---- */
  function openInvite(anchorEl){
    closePopover();
    popwrap.dataset.open = 'INVITE';
    const H = 62;
    const c = uiCanvas(135, H + 4, S2);
    const ctx = c.getContext('2d');
    const anchorMidX = anchorEl.getBoundingClientRect().left + anchorEl.getBoundingClientRect().width / 2;
    const popW = 135 * S2;
    const popLeft = Math.max(8, Math.min(Math.round(anchorMidX - 30), innerWidth - popW - 8));
    const arrowAt = Math.max(8, Math.min(Math.round((anchorMidX - popLeft) / S2), 124));
    const pw = hifiPopover(ctx, 0, 3, 132, H, T8, 'top', arrowAt);
    drawText(ctx, 'INVITE A FRIEND', pw.wx + 4, pw.wy + 3, 'silver1');
    drawText(ctx, 'SHARE YOUR GUILD CODE', pw.wx + 4, pw.wy + 13, 'sky_mid');
    const code = 'WQ-EHB8';
    drawText(ctx, code, pw.wx + Math.round((pw.ww - textWidth(code)) / 2), pw.wy + 24, 'gold1');
    hifiButton(ctx, pw.wx + 3, pw.wy + 36, pw.ww - 6, 15, AU, { text: 'COPY CODE' });
    const copyRect = { x: pw.wx + 3, y: pw.wy + 36, w: pw.ww - 6, h: 16 };
    c.addEventListener('click', e => {
      e.stopPropagation();
      const r = c.getBoundingClientRect();
      const mx = Math.floor((e.clientX - r.left) / (r.width / c.width));
      const my = Math.floor((e.clientY - r.top) / (r.height / c.height));
      if (mx >= copyRect.x && mx < copyRect.x + copyRect.w &&
          my >= copyRect.y && my < copyRect.y + copyRect.h){
        try { navigator.clipboard.writeText(code); } catch (_) {}
        showToast('CODE COPIED!');
        closePopover();
      }
    });
    popwrap.appendChild(c);
    const railRect = rail.getBoundingClientRect();
    popwrap.style.left = popLeft + 'px';
    popwrap.style.top = Math.round(railRect.bottom + 4) + 'px';
  }
  {
    const S = 18;
    const c = uiCanvas(S, S + 6, S2), ctx = c.getContext('2d');   // +6 aligns with mates' sliver row
    const well = hifiFrameSlim(ctx, 0, 0, S, S, 5, AG, 'night_wd');
    // plus: 6x6 grid, 2px stroke — all-even geometry so the arms are symmetric
    const px0 = well.wx + Math.floor((well.ww - 6) / 2), py0 = well.wy + Math.floor((well.wh - 6) / 2);
    px(ctx, px0, py0 + 2, 6, 2, 'silver1');
    px(ctx, px0 + 2, py0, 2, 6, 'silver1');
    c.style.cursor = 'pointer';
    c.addEventListener('click', e => {
      e.stopPropagation();
      if (popwrap.dataset.open === 'INVITE') closePopover();
      else openInvite(c);
    });
    rail.appendChild(c);
  }
  document.addEventListener('click', () => closePopover());

  /* ---- help modal (the ? nav button) ---- */
  const scrim = document.getElementById('scrim');
  scrim.addEventListener('click', () => { scrim.style.display = 'none'; });
  function openHelp(){
    scrim.textContent = '';
    scrim.style.display = 'flex';
    const c = uiCanvas(135, 170, S2);
    const ctx = c.getContext('2d');
    const md = hifiModal(ctx, 2, 4, 131, 160, T8, 'HOW TO PLAY');
    const lines = [
      ['WALK EVERY DAY.', 'silver1'],
      ['STEPS BECOME ENERGY.', 'sky_mid'],
      ['DEPLOY TO STRIKE THE', 'silver1'],
      ['WEEKLY BOSS TOGETHER.', 'sky_mid'],
      ['IDLE DAMAGE TICKS 24/7.', 'sky_mid'],
      ['RALLY RESTING FRIENDS.', 'sky_mid'],
      ['JOBS RESET MONDAYS.', 'sky_mid'],
    ];
    lines.forEach(([ln, key], i) => drawText(ctx, ln, md.well.wx + 6, 22 + i * 10, key));
    const ok = { x: 2 + Math.round((131 - 44)/2), y: 4 + 160 - 24, w: 44, h: 16 };
    hifiButton(ctx, ok.x, ok.y, ok.w, ok.h - 1, AG, { text: 'OK' });
    c.addEventListener('click', e => {
      e.stopPropagation();
      const r = c.getBoundingClientRect();
      const mx = Math.floor((e.clientX - r.left) / (r.width / c.width));
      const my = Math.floor((e.clientY - r.top) / (r.height / c.height));
      const inR = q => mx >= q.x && mx < q.x + q.w && my >= q.y && my < q.y + q.h;
      if (inR(md.closeRect) || inR(ok)) scrim.style.display = 'none';
    });
    scrim.appendChild(c);
  }
}
</script>
</body>
</html>
